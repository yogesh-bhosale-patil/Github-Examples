name: Context Workflows

on: [push]

jobs:
  my-context:
    runs-on: ubuntu-latest
    steps:
      - name: "My Step 1"
        run: echo "Hello !! $MY_ACTION"
        env:
            MY_ACTION: ${{github.action}}
      - name: "My Step 2"
        run: echo "Hello !! $MY_ACTION"
        env:
            MY_ACTOR: ${{github.actor}}